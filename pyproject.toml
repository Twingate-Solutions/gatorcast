[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatorcast"
version = "0.5.0"
description = "Self-hosted ingest, reassembly, and replay UI for Twingate Identity Firewall Gateway session recordings (asciicast v2)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ben Cameron" }]
dependencies = [
    "fastapi==0.137.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "aiosqlite==0.22.1",
    "structlog==26.1.0",
    "apscheduler==3.11.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "cryptography==49.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gatorcast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
